<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="可鹿心理用户端">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="可鹿心理">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>可鹿心理</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f5f8f6; }
    #app-loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #286d64; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app-loading > div { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #app-loading-spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #dce9e4; border-top-color: #286d64;
      animation: loading-spin .8s linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div><div id="app-loading-spinner"></div><span>可鹿正在准备页面…</span></div>
  </div>
  <!-- 演示环境（mock 预览包）：旧版构建注册的 Service Worker 会强缓存
       main.dart.js，导致刷新后仍跑旧代码。这里在引导前注销所有 SW 并
       清空 Cache Storage，保证每次刷新都是最新版本。 -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
      if ('caches' in window) {
        caches.keys().then(function (ks) {
          ks.forEach(function (k) { caches.delete(k); });
        });
      }
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
